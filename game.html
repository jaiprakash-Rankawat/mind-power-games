<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mind Power Games</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/tutorial.css" />
</head>
<body class="game-page">
  <div class="shell">
    <header class="shell-head">
      <button id="backBtn" class="ghost-btn" type="button">&larr; Games</button>
      <div class="shell-title">
        <h1 id="gameTitle">Loading…</h1>
        <p id="gameTag" class="sub"></p>
      </div>
      <button id="themeBtn" class="theme-btn" type="button" title="Toggle theme">☀️</button>
      <div class="sound-ctl">
        <button id="soundBtn" class="ghost-btn icon-btn" type="button" title="Mute / unmute (M)" aria-label="Mute or unmute">&#9835;</button>
        <input id="volSlider" class="vol" type="range" min="0" max="100" step="5" value="60"
               title="Volume" aria-label="Volume" />
      </div>
    </header>
    <main id="stage" class="stage"></main>
  </div>
  <script type="module" src="js/game-shell.js"></script>
</body>
</html>
