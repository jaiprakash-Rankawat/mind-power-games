<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mind Power Games</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/viz.css" />
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body class="popup">
  <header class="hub-head">
    <img class="logo" src="icons/logo.svg" alt="" width="38" height="38" />
    <div>
      <h1>Mind Power Games</h1>
      <p class="sub">Eleven cognitive games. Take the test, or practise.</p>
    </div>
    <button id="themeBtn" class="theme-btn" type="button" title="Toggle theme">☀️</button>
  </header>

  <button id="dailyCard" class="daily-card" type="button"></button>

  <button id="brainCard" class="brain-card" type="button" aria-label="Open your full brain profile"></button>

  <button id="testCard" class="test-card" type="button"></button>

  <h2 class="section-label">Practice</h2>
  <main id="gameList" class="game-list"></main>

  <footer class="hub-foot">
    <span id="footStats"></span>
    <button id="resetBtn" class="link-btn" type="button">Reset progress</button>
  </footer>

  <script type="module" src="js/popup.js"></script>
</body>
</html>
