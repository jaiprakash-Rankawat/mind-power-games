<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Brain Test · Mind Power Games</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="css/viz.css" />
  <link rel="stylesheet" href="css/test.css" />
</head>
<body class="game-page">
  <div class="shell">
    <header class="shell-head">
      <button id="leaveBtn" class="ghost-btn" type="button">&larr; Leave</button>
      <div class="shell-title">
        <p class="bt-kicker">Brain Test</p>
        <h1 id="stepLabel">Brain Test</h1>
      </div>
      <button id="themeBtn" class="theme-btn" type="button" title="Toggle theme">☀️</button>
      <div class="sound-ctl">
        <button id="soundBtn" class="ghost-btn icon-btn" type="button" title="Mute / unmute (M)" aria-label="Mute or unmute">&#9835;</button>
        <input id="volSlider" class="vol" type="range" min="0" max="100" step="5" value="60"
               title="Volume" aria-label="Volume" />
      </div>
    </header>
    <div id="progress" class="bt-progress" aria-hidden="true"></div>
    <main id="stage" class="stage"></main>
  </div>
  <script type="module" src="js/test-runner.js"></script>
</body>
</html>
